name: Release current main branch.
on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      version:
        description: "Override the version tag (e.g. v1.2.3). Empty = automatic semantic version."
        required: false
        type: string
permissions:
  contents: write
concurrency:
  group: release
  cancel-in-progress: false
jobs:
  tests:
    uses: ./.github/workflows/tests.yaml
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: tests
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
          fetch-tags: true
      - name: Determine the release version
        id: version
        env:
          VERSION_OVERRIDE: ${{ inputs.version }}
        run: .github/scripts/determine-version
      - name: Create and push the release
        if: steps.version.outputs.skip != 'true'
        run: .github/scripts/create-release "${{ steps.version.outputs.version }}"
