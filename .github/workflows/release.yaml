name: Release current main branch.
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version tag (e.g. v1.0.0)"
        required: true
        type: string
permissions:
  contents: write
jobs:
  tests:
    uses: ./.github/workflows/tests.yaml
    secrets: inherit
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: tests
    steps:
      - name: Validate the given version
        run: |
          if ! [[ "${{ inputs.version }}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Version '${{ inputs.version }}' does not match vMAJOR.MINOR.PATCH."
            exit 1
          fi
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-tags: true
      - name: Stop when the tag already exists
        run: |
          if git rev-parse "${{ inputs.version }}" >/dev/null 2>&1; then
            echo "Tag ${{ inputs.version }} already exists. Stopping release."
            exit 1
          fi
      - name: Select files from main to release.
        run: |
          git config user.name "github-release-bot[${{ github.actor }}]"
          git config user.email "github-release-bot@noreply.github.com"
          git checkout --orphan "Release"
          git rm -rfq .
          git checkout main -- \
            scripts \
            lua \
            .gitignore \
            dependencies \
            init.lua \
            install \
            lazy-lock.json \
            LICENSE \
            README.md
      - name: Remove development section from README.md
        run: |
          sed -i '/^## Development/,/^## Notes & Feedback/ {/^## Notes & Feedback/!d}' README.md
      - name: Commit, tag and push the release.
        run: |
          git add \
            scripts \
            lua \
            .gitignore \
            dependencies \
            init.lua \
            install \
            lazy-lock.json \
            LICENSE \
            README.md
          git commit -m "Release ${{ inputs.version }}"
          git tag -a "${{ inputs.version }}" -m "Release ${{ inputs.version }}"
          git tag -f latest
          git push origin --tags --force
