name: Development
on:
  pull_request:
    branches:
      - main
      - dev
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Cache the linter environments
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/pre-commit
            ~/.cargo/bin/selene
          key: lint-${{ runner.os }}-${{ hashFiles('.pre-commit-config.yaml') }}
      - name: Install selene
        run: command -v selene || cargo install selene
      - name: Install hadolint
        run: |
          sudo curl -sSL -o /usr/local/bin/hadolint \
            https://github.com/hadolint/hadolint/releases/download/v2.15.1/hadolint-Linux-x86_64
          sudo chmod +x /usr/local/bin/hadolint
      - name: Install pre-commit
        run: pipx install pre-commit
      - name: Run the linting pre-commit
        run: pre-commit run --all-files
  tests:
    needs: lint
    uses: ./.github/workflows/tests.yaml
